<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Job Seeker Registration | Skill India Digital</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="container">
<h1>Skill India Digital</h1>
<p>Job Seeker Registration</p>
</div>
</header>

<section class="services">

<div class="container">

<h2>Register for Jobs</h2>

<form action="#" method="post">

<label>Full Name</label>
<input type="text" placeholder="Enter Full Name" required>

<label>Mobile Number</label>
<input type="tel" placeholder="Enter Mobile Number" required>

<label>WhatsApp Number</label>
<input type="tel" placeholder="Enter WhatsApp Number">

<label>Age</label>
<input type="number" placeholder="Enter Age" required>

<label>Gender</label>
<select required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Education</label>
<select required>
<option value="">Select Education</option>
<option>Below 10th</option>
<option>10th Pass</option>
<option>12th Pass</option>
<option>ITI</option>
<option>Diploma</option>
<option>Graduate</option>
</select>

<label>State</label>
<input type="text" placeholder="State">

<label>District</label>
<input type="text" placeholder="District">

<label>Preferred Job</label>
<select required>
<option value="">Select Job</option>
<option>Factory Worker</option>
<option>Security Guard</option>
</select>

<label>Experience</label>
<select>
<option>Fresher</option>
<option>Less than 1 Year</option>
<option>1-3 Years</option>
<option>More than 3 Years</option>
</select>

<label>Ready to Relocate to Chennai?</label>
<select required>
<option>Yes</option>
<option>No</option>
</select>

<label>Additional Information</label>
<textarea rows="5" placeholder="Write anything you want us to know"></textarea>

<br><br>

<button class="btn" type="submit">
Submit Registration
</button>

</form>

</div>

</section>

<footer>

<div class="container">

<p>© 2026 Skill India Digital</p>

<p>Helping Job Seekers Build Better Careers.</p>

</div>

</footer>

</body>
</html>
