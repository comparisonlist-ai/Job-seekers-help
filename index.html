<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#1565C0">

    <meta
        name="description"
        content="Students Homework AI - Smart AI Homework Help for CBSE Classes 6 to 10">

    <meta
        name="keywords"
        content="CBSE, NCERT, AI Homework, Class 6, Class 7, Class 8, Class 9, Class 10">

    <meta
        name="author"
        content="Sibaram Dalabehera">

    <title>

        Students Homework AI

    </title>

    <link
        rel="icon"
        href="images/logo.png"
        type="image/png">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div id="app">

<div
    id="appMessage"
    class="app-message hidden">
</div>

<!-- =====================================================
HOME SCREEN
===================================================== -->

<section
    id="homeScreen"
    class="screen">

    <div class="home-container">

        <img
            src="images/logo.png"
            alt="Students Homework AI"
            class="home-logo">

        <h1 class="home-title">

            Students Homework AI

        </h1>

        <p class="home-subtitle">

            AI Homework Help for
            CBSE Classes 6–10

        </p>

        <button
            class="primary-btn"
            onclick="showRegistrationScreen()">

            🚀 Start FREE Trial

        </button>

        <div class="login-card">

            <h3>

                Already Registered?

            </h3>

            <button
                class="secondary-btn"
                onclick="showLoginScreen()">

                🔐 Student Login

            </button>

        </div>

    </div>

</section>

<!-- =====================================================
REGISTRATION SCREEN
===================================================== -->

<section
    id="registrationScreen"
    class="screen hidden">

    <button
        class="back-btn"
        onclick="showHome()">

        ← Back

    </button>

    <div class="card">

        <h2>

            Student Registration

        </h2>

        <p>

            Register once and receive
            your unique Student ID.

        </p>

        <form
            id="registrationForm">

            <div class="form-group">

                <label>

                    Student Name

                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter Student Name"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Select Class

                </label>

                <select
                    id="studentClass"
                    required>

                    <option value="">

                        Choose Class

                    </option>

                    <option value="6">

                        Class 6

                    </option>

                    <option value="7">

                        Class 7

                    </option>

                    <option value="8">

                        Class 8

                    </option>

                    <option value="9">

                        Class 9

                    </option>

                    <option value="10">

                        Class 10

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>

                    Mobile Number

                </label>

                <input
                    type="tel"
                    id="studentMobile"
                    maxlength="10"
                    placeholder="10 Digit Mobile Number"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Parent Mobile (Optional)

                </label>

                <input
                    type="tel"
                    id="parentMobile"
                    maxlength="10"
                    placeholder="Parent Mobile Number">

            </div>

            <button
                type="submit"
                id="registerButton"
                class="primary-btn">

                🚀 Register

            </button>

        </form>

    </div>

</section>
